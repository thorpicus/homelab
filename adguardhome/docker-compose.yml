services:
  adguardhome:
    image: adguard/adguardhome:v0.107.55
    container_name: adguardhome
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${HOMELAB}/adguardhome/workdir:/opt/adguardhome/work
      - ${HOMELAB}/adguardhome/confdir:/opt/adguardhome/conf
    ports:
      # Bind to your local LAN IP
      - "192.168.1.3:53:53/tcp"
      - "192.168.1.3:53:53/udp"
      # Bind to your Tailscale 100.x.x.x IP
      - "100.86.21.103:53:53/tcp"
      - "100.86.21.103:53:53/udp"
      # Web Admin controls (can keep global or bind specifically)
      - "3000:3000/tcp"
      - "8080:80/tcp"
