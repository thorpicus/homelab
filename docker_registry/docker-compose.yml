version: '3.8'

services:
  docker-registry:
    image: registry:2
    container_name: local-docker-registry
    restart: always
    ports:
      - "5000:5000"
    environment:
      # Optional: You can configure registry settings here
      REGISTRY_STORAGE_DELETE_ENABLED: "true" # Allows you to delete images to free up space
    volumes:
      # This ensures your images aren't lost if the container stops or updates
      - registry_data:/var/lib/registry
    networks:
      - proxy-tier

volumes:
  registry_data:

networks:
  proxy-tier:
    external: true
