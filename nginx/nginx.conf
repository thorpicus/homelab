    # MARK: Registry
    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name registry.at.home;

        # Reuses your mounted docker certificates
        ssl_certificate     /etc/nginx/certs/at.home.crt;
        ssl_certificate_key /etc/nginx/certs/at.home.key;

        # CRITICAL: Prevent Nginx from rejecting large image uploads (413 Payload Too Large)
        client_max_body_size 0;

        # CRITICAL: Disable request buffering so giant image layers can stream right through Nginx
        # directly into your registry without running out of disk space or timing out.
        proxy_request_buffering off;
        proxy_buffering off;

        location / {
            proxy_pass http://docker-registry:5000;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL: Required header for Docker Registry v2 API compliance
            # Without this, the Docker client might think it's dealing with an old v1 API.
            proxy_set_header 'Docker-Distribution-Api-Version' 'registry/2.0';
            add_header 'Docker-Distribution-Api-Version' 'registry/2.0' always;

            # WebSocket Support (Required for Home Assistant / Web UI live updates)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # MARK: VSCode
    #
    # Map block to handle VS Code WebSocket connection upgrades cleanly
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name vscode.at.home;

        # SSL Termination
        ssl_certificate     /etc/nginx/certs/at.home.crt;
        ssl_certificate_key /etc/nginx/certs/at.home.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            # Fix: Points out of the container to the host machine IP
            proxy_pass http://host.docker.internal:8000;

            proxy_http_version 1.1;

            # Headers (Query parameters like ?tkn=12345 pass through automatically)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSockets for VS Code stability
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Buffers & Timeouts
            proxy_connect_timeout      60;
            proxy_send_timeout         90;
            proxy_read_timeout         90;
            proxy_buffer_size          4k;
            proxy_buffers              4 32k;
            proxy_busy_buffers_size    64k;
            proxy_temp_file_write_size 64k;
        }
    }





