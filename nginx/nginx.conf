events { 
    worker_connections 1024; 
}

http {
    # 1. Global SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Define Backends
    upstream photos      { server immich-server:2283; }
    upstream music       { server 192.168.1.3:8081; }
    upstream monitoring  { server beszel:8090; }
    upstream registry    { server docker-registry:5000; }
    upstream assistant   { server 192.168.1.3:8123; }
    upstream wine-server { server wine-server:3000; }
    upstream wine        { server wine-client:80; }
    upstream nas         { server atnas.taile8f2ff.ts.net:5000; }
    upstream tv          { server jellyfin:8096; }

    # Map block to handle VS Code WebSocket connection upgrades cleanly
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 2. Shared Global Proxy Configurations (Inherited by all servers)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Global upload optimization limits
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;


    # 3. Force HTTP to HTTPS Redirect
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --- ROOT LANDING PAGE DASHBOARD ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name athome.taile8f2ff.ts.net;

        ssl_certificate     /etc/nginx/certs/athome.taile8f2ff.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/athome.taile8f2ff.ts.net.key;

        location / {
            root /var/www/landing-page;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }


    # 4. Individual Secure HTTPS Subdomain Server Blocks

    # --- PHOTOS ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name photos.athome.taile8f2ff.ts.net;

        ssl_certificate     /etc/nginx/certs/photos.athome.taile8f2ff.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/photos.athome.taile8f2ff.ts.net.key;

        location / {
            proxy_pass http://photos;
        }
    }

    # --- MUSIC ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name music.athome.taile8f2ff.ts.net;

        ssl_certificate     /etc/nginx/certs/music.athome.taile8f2ff.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/music.athome.taile8f2ff.ts.net.key;

        location / {
            proxy_pass http://music;
        }
    }

    # --- MONITORING ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name monitoring.athome.taile8f2ff.ts.net;

        ssl_certificate     /etc/nginx/certs/monitoring.athome.taile8f2ff.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/monitoring.athome.taile8f2ff.ts.net.key;

        location / {
            proxy_pass http://monitoring;
        }
    }

    # --- HOME ASSISTANT ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name assistant.athome.taile8f2ff.ts.net;

        ssl_certificate     /etc/nginx/certs/assistant.athome.taile8f2ff.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/assistant.athome.taile8f2ff.ts.net.key;

        location / {
            proxy_pass http://assistant;
        }
    }

    # --- WINE SERVER ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name wine-server.athome.taile8f2ff.ts.net;

        ssl_certificate     /etc/nginx/certs/wine-server.athome.taile8f2ff.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/wine-server.athome.taile8f2ff.ts.net.key;

        location / {
            proxy_pass http://wine-server;
        }
    }

    # --- WINE CLIENT ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name wine.athome.taile8f2ff.ts.net;

        ssl_certificate     /etc/nginx/certs/wine.athome.taile8f2ff.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/wine.athome.taile8f2ff.ts.net.key;

        location / {
            proxy_pass http://wine;
        }
    }

    # --- NAS ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name nas.athome.taile8f2ff.ts.net;

        ssl_certificate     /etc/nginx/certs/nas.athome.taile8f2ff.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/nas.taile8f2ff.ts.net.key;

        location / {
            proxy_pass http://nas;
        }
    }

    # --- JELLYFIN TV ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name tv.athome.taile8f2ff.ts.net;

        ssl_certificate     /etc/nginx/certs/tv.athome.taile8f2ff.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/tv.athome.taile8f2ff.ts.net.key;

        location / {
            proxy_pass http://tv;
        }
    }

    # --- DOCKER REGISTRY ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name registry.athome.taile8f2ff.ts.net;

        ssl_certificate     /etc/nginx/certs/registry.athome.taile8f2ff.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/registry.athome.taile8f2ff.ts.net.key;

        location / {
            proxy_pass http://registry;
            
            # API compliance headers required strictly for docker engine pushing
            proxy_set_header 'Docker-Distribution-Api-Version' 'registry/2.0';
            add_header 'Docker-Distribution-Api-Version' 'registry/2.0' always;
        }
    }

    # --- VSCODE ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name vscode.athome.taile8f2ff.ts.net;

        ssl_certificate     /etc/nginx/certs/vscode.athome.taile8f2ff.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/vscode.athome.taile8f2ff.ts.net.key;

        location / {
            proxy_pass http://docker.internal;

            # Custom connection mapping specific to VSCode connection engine
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto https;

            # Optimized VS Code Streams & Buffers 
            proxy_connect_timeout      60;
            proxy_send_timeout         90;
            proxy_read_timeout         90;
            proxy_buffer_size          4k;
            proxy_buffers              4 32k;
            proxy_busy_buffers_size    64k;
            proxy_temp_file_write_size 64k;
        }
    }
}
