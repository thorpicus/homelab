events { 
    worker_connections 1024; 
}

http {
    # 1. Global SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # the live wildcard cert folder inside the container volume
    ssl_certificate     /etc/letsencrypt/live/amysackville.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amysackville.co.uk/privkey.pem;


    # Define Backends
    upstream photos      { server immich-server:2283; }
    upstream tv          { server jellyfin:8096; }
    upstream music       { server 192.168.1.3:8081; }
    upstream assistant   { server 192.168.1.3:8123; }
    upstream adguard     { server 192.168.1.3:8080; }

    upstream wines       { server cellardoor_nginx:80; }

    upstream monitoring  { server beszel:8090; }
    upstream registry    { server docker-registry:5000; }
    upstream nas         { server atnas.taile8f2ff.ts.net:5000; }

    # Map block to handle VS Code WebSocket connection upgrades cleanly
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 2. Shared Global Proxy Configurations (Inherited by all servers)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Global upload optimization limits
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;


    # 3. Force HTTP to HTTPS Redirect
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # MARK: ROOT LANDING PAGE DASHBOARD 
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name home.amysackville.co.uk;

        location / {
            root /var/www/landing-page;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }


    # 4. Individual Secure HTTPS Subdomain Server Blocks

    # MARK: PHOTOS 
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name photos.amysackville.co.uk;

        location / {
            proxy_pass http://photos;
        }
    }

    # MARK: MUSIC 
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name music.amysackville.co.uk;

        location / {
            proxy_pass http://music;
        }
    }

    # MARK: MONITORING 
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name monitoring.amysackville.co.uk;

        location / {
            proxy_pass http://monitoring;
        }
    }

    # MARK: ADGUARD 
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name adguard.amysackville.co.uk;

        location / {
            proxy_pass http://adguard;
        }
    }


    # MARK: HOME ASSISTANT 
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name assistant.amysackville.co.uk;

        location / {
            proxy_pass http://assistant;
        }
    }


   # MARK: Cellar Door Wines 
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name wines.amysackville.co.uk;

        location / {
            proxy_pass http://wines;

            # 1. Tells the downstream container the public connection is secure
            proxy_set_header X-Forwarded-Proto https;

            # 2. Passes the original client IP down the chain
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 3. Preserves the incoming Host header
            proxy_set_header Host $host;

            # --- WEBSOCKET & STREAM UPGRADE HEADERS ---
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # --- TIMEOUTS & STREAMING ---
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;

        }
    }

    # MARK: NAS 
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name nas.amysackville.co.uk;

        location / {
            proxy_pass http://nas;
        }
    }

    # MARK: JELLYFIN TV 
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name tv.amysackville.co.uk;

        location / {
            proxy_pass http://tv;
        }
    }

    # MARK: DOCKER REGISTRY 
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name registry.amysackville.co.uk;

        location / {
            proxy_pass http://registry;

            # API compliance headers required strictly for docker engine pushing
            proxy_set_header 'Docker-Distribution-Api-Version' 'registry/2.0';
            add_header 'Docker-Distribution-Api-Version' 'registry/2.0' always;
        }
    }

    # MARK: VSCODE 
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name vscode.amysackville.co.uk;

        location / {
            proxy_pass http://host.docker.internal;

            # Custom connection mapping specific to VSCode connection engine
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto https;

            # Optimized VS Code Streams & Buffers 
            proxy_connect_timeout      60;
            proxy_send_timeout         90;
            proxy_read_timeout         90;
            proxy_buffer_size          4k;
            proxy_buffers              4 32k;
            proxy_busy_buffers_size    64k;
            proxy_temp_file_write_size 64k;
        }
    }
}
