    # MARK: Registry
    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name registry.at.home;

        # Reuses your mounted docker certificates
        ssl_certificate     /etc/nginx/certs/at.home.crt;
        ssl_certificate_key /etc/nginx/certs/at.home.key;

        # CRITICAL: Prevent Nginx from rejecting large image uploads (413 Payload Too Large)
        client_max_body_size 0;

        # CRITICAL: Disable request buffering so giant image layers can stream right through Nginx
        # directly into your registry without running out of disk space or timing out.
        proxy_request_buffering off;
        proxy_buffering off;

        location / {
            proxy_pass http://docker-registry:5000;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL: Required header for Docker Registry v2 API compliance
            # Without this, the Docker client might think it's dealing with an old v1 API.
            proxy_set_header 'Docker-Distribution-Api-Version' 'registry/2.0';
            add_header 'Docker-Distribution-Api-Version' 'registry/2.0' always;

            # WebSocket Support (Required for Home Assistant / Web UI live updates)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # MARK: Cellar Door
    server {
