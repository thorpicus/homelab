version: '3.8'
services:
  reverse-proxy:
    image: nginx:alpine
    container_name: local-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certificates/at.home:/etc/nginx/certs:ro
    networks:
      - proxy-tier
    # Allows Nginx to talk to the host machine via a special DNS name
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  proxy-tier:
    external: true
