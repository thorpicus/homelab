services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://athome:8090
    ports:
      - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    healthcheck:
      test: ['CMD', '/beszel', 'health', '--url', 'http://athome:8090']
      interval: 120s
      start_period: 10s
      timeout: 5s
    networks:
      - default
      - proxy-tier

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: 509ccc46-f4e5-4c95-a602-423e6d7d30a2
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPilD58t2KIIyCgvyvBp+vDWm8n8YGMMItZn8iiBzBZt"
    healthcheck:
      test: ['CMD', '/agent', 'health']
      interval: 120s

networks:
  proxy-tier:
      external : true
